<div class="toast-container position-fixed bottom-0 end-0 p-3" style="z-index: 1080;">
  @for (t of toastService.toasts(); track t.id) {
    <div class="toast show align-items-center border-0 mb-2 text-white"
         [class.bg-success]="t.type === 'success'"
         [class.bg-danger]="t.type === 'danger'"
         [class.bg-info]="t.type === 'info'"
         role="alert">
      <div class="d-flex">
        <div class="toast-body">{{ t.text }}</div>
        <button type="button" class="btn-close btn-close-white me-2 m-auto" (click)="toastService.dismiss(t.id)"></button>
      </div>
    </div>
  }
</div>
