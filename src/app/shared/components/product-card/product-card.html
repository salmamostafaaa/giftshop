<a
  [routerLink]="['/products', product.id]"
  class="card h-100 shadow-sm border-0 card-hover text-decoration-none text-reset">
  <div class="ratio ratio-1x1 bg-mist rounded-top overflow-hidden">
    <img
      [src]="product.image_link || placeholderImage"
      (error)="$any($event.target).src = placeholderImage"
      class="w-100 h-100 object-fit-cover"
      style="object-fit: cover;"
      [alt]="product.name">
  </div>

  <div class="card-body d-flex flex-column">
    @if (product.category) {
      <span class="badge bg-mist text-ink border align-self-start text-capitalize mb-2">
        {{ product.category.replace('_', ' ') }}
      </span>
    }

    <h6 class="card-title mb-1">{{ product.name }}</h6>
    <p class="text-slate small mb-2">{{ product.brand || 'Aura' }}</p>

    <app-star-rating [rating]="product.rating" class="mb-2"></app-star-rating>

    <div class="mt-auto d-flex align-items-center justify-content-between">
      <span class="fw-bold text-ink fs-5">
        {{ product.price_sign || '$' }}{{ product.price }}
      </span>
      <button class="btn btn-sage btn-sm" (click)="onAddToCart($event)">
        <i class="bi bi-cart-plus me-1"></i>Add
      </button>
    </div>
  </div>
</a>
